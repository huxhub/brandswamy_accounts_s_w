<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 100" fill="none">
  <!-- U -->
  <path
    d="M 20 10 V 63 C 20 78 32 90 47 90 C 62 90 74 78 74 63 V 10"
    stroke="#1e2022"
    stroke-width="13"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- X with 4 diagonal rays -->
  <g stroke="#1e2022" stroke-width="13" stroke-linecap="round">
    <line x1="103" y1="10" x2="133" y2="40" />
    <line x1="103" y1="90" x2="133" y2="60" />
    <line x1="183" y1="10" x2="153" y2="40" />
    <line x1="183" y1="90" x2="153" y2="60" />
  </g>

  <!-- Center Orange Dot -->
  <circle cx="143" cy="50" r="5.5" fill="#f56523" />

  <!-- Vertical HUB Text (Rotated -90deg, reading H -> U -> B bottom-to-top) -->
  <g transform="rotate(-90 224 50)">
    <text
      x="224"
      y="60"
      font-family="'Inter', 'Outfit', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="800"
      font-size="31"
      fill="#1e2022"
      letter-spacing="0.22em"
      text-anchor="middle"
    >HUB</text>
  </g>
</svg>
